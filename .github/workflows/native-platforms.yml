name: Fixed native platform acceptance
on:
  workflow_dispatch:
    inputs:
      english_ocr:
        description: Download hash-pinned English models into the isolated evidence directory
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute official pinned binary on actual platform
        run: python -I -B tests/platform_acceptance.py --platform ${{ matrix.platform }} --workdir native-evidence ${{ inputs.english_ocr && '--with-english-models' || '' }}
      - name: Preserve native observations even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            native-evidence/*.json
            native-evidence/*.log
            native-evidence/*.pdf
            native-evidence/*.pam
          if-no-files-found: error
