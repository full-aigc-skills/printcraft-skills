schema: spec-driven
context: |
  文档使用中文，规范使用 SHALL/MUST 与 WHEN/THEN 关键字。
  当前项目是已有 Python 实现的本地未发布候选，尚未初始化 Git。
  OpenSpec 是唯一正式规格事实源；不创建另一套独立 requirements/plan/tasks。
  规格编写不代表功能实现。实现、本地测试、原生运行、宿主与发布证据分别记录。
  当前用户已授权完成计划实施与隔离验证；提交、远端发行和市场发布仍按各自授权边界。
rules:
  specs:
    - 每项需求必须具备可观察、可验证的场景，并明确不支持与未知结果。
  tasks:
    - 使用编号复选框，关联需求编号和验证证据；未实现任务不得勾选。
